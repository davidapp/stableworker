name: Build

# v* 标签构建正式发布候选；手动运行只保留 Artifact，不改动更新频道。
# 发布前验证版本、元数据、完整文件哈希及 macOS 签名/公证。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build installers
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          # An empty CSC_LINK is treated as a certificate path by the macOS packager.
          if [[ -z "$CSC_LINK" ]]; then unset CSC_LINK; fi
          if [[ "$RUNNER_OS" == "macOS" && "$GITHUB_REF" == refs/tags/v* ]]; then
            missing=0
            for key in CSC_LINK APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [[ -z "${!key}" ]]; then
                echo "::warning::macOS signing credential $key is not configured"
                missing=1
              fi
            done
            if [[ $missing -eq 1 ]]; then
              # 策略（docs/releasing.md）：未签名的 macOS 包不能发布（无法自动更新），
              # 但也不能因 macOS 卡住 Windows/Linux 的正常发版 → 显式跳过该平台。
              echo "MACOS_SKIPPED=1" >> "$GITHUB_ENV"
              echo "macOS release build skipped: signing credentials not configured. Windows/Linux ship normally."
              exit 0
            fi
            npm run dist -- --config.mac.forceCodeSigning=true --config.mac.notarize=true
          elif [[ "$RUNNER_OS" == "Windows" && -n "$WIN_CSC_LINK" ]]; then
            npm run dist -- --config.win.forceCodeSigning=true
          else
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              echo "::warning::Windows certificate is not configured; installers will be unsigned."
            fi
            npm run dist
          fi

      - name: Verify update assets
        if: env.MACOS_SKIPPED != '1'
        run: npm run verify:release

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.MACOS_SKIPPED != '1'
        shell: bash
        run: |
          for app in release/mac/StableWorker.app release/mac-arm64/StableWorker.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      - name: Upload artifacts
        if: env.MACOS_SKIPPED != '1'
        uses: actions/upload-artifact@v7
        with:
          name: stableworker-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: stableworker-*
          path: artifacts
          merge-multiple: true
      - name: Verify merged release
        shell: bash
        run: |
          # macOS 无签名凭据被跳过时，资产里没有 darwin 产物 → 只校验 Win/Linux
          if ls artifacts/*.dmg >/dev/null 2>&1; then
            npm run verify:release -- artifacts all
          else
            echo "::warning::No macOS assets (signing credentials not configured); verifying Windows + Linux only."
            npm run verify:release -- artifacts win32
            npm run verify:release -- artifacts linux
          fi
      - name: Release notes preamble
        shell: bash
        run: |
          {
            echo "### 平台覆盖"
            if ls artifacts/*.dmg >/dev/null 2>&1; then
              echo "Windows / Linux / macOS（已签名公证）全平台发布。"
            else
              echo "**macOS 本版跳过**：签名/公证凭据未配置，本版无 macOS 资产；macOS 用户请继续手动安装，等待后续签名版本。Windows / Linux 正常发布与自动更新。"
            fi
          } > release-body.md
      - name: Create release candidate
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          body_path: release-body.md
          # 上传集合 = verify 刚逐文件校验过的 artifacts 目录全部内容
          # （平台组合可变：macOS 跳过时无 dmg/zip，不能用逐扩展名通配）
          files: artifacts/*
          generate_release_notes: true
