name: Build

# v* 标签构建正式发布候选；手动运行只保留 Artifact，不改动更新频道。
# 发布前验证版本、元数据、完整文件哈希及 macOS 签名/公证。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build installers
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          # An empty CSC_LINK is treated as a certificate path by the macOS packager.
          if [[ -z "$CSC_LINK" ]]; then unset CSC_LINK; fi
          if [[ "$RUNNER_OS" == "macOS" && "$GITHUB_REF" == refs/tags/v* ]]; then
            for key in CSC_LINK APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [[ -z "${!key}" ]]; then
                echo "::error::macOS release requires $key; see docs/releasing.md"
                exit 1
              fi
            done
            npm run dist -- --config.mac.forceCodeSigning=true --config.mac.notarize=true
          elif [[ "$RUNNER_OS" == "Windows" && -n "$WIN_CSC_LINK" ]]; then
            npm run dist -- --config.win.forceCodeSigning=true
          else
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              echo "::warning::Windows certificate is not configured; installers will be unsigned."
            fi
            npm run dist
          fi

      - name: Verify update assets
        run: npm run verify:release

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          for app in release/mac/StableWorker.app release/mac-arm64/StableWorker.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stableworker-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: stableworker-*
          path: artifacts
          merge-multiple: true
      - name: Verify merged release
        run: npm run verify:release -- artifacts all
      - name: Create release candidate
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.blockmap
            artifacts/latest*.yml
          generate_release_notes: true
