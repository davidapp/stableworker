name: Check

# 推送到 main / PR 时的快速质量门：类型检查 + 单元测试 + 覆盖率统计。
# （重型打包见 build.yml，仅在 v* 标签 / 手动触发时运行。）

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage
